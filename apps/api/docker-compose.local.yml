name: campushomes-local

# Persistent local-development infrastructure. Automated tests use the
# separate disposable database in docker-compose.test.yml on port 54329.
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: campushomes
      POSTGRES_PASSWORD: campushomes_dev
      POSTGRES_DB: campushomes_dev
    ports:
      - '54328:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campushomes -d campushomes_dev']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:

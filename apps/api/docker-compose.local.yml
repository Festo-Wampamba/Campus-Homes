name: campushomes-local

# Persistent local-development infrastructure. Automated tests use the
# separate disposable database in docker-compose.test.yml on port 54329.
services:
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campushomes
      POSTGRES_PASSWORD: campushomes_dev
      POSTGRES_DB: campushomes_dev
    # Below the kernel's ephemeral range (32768-60999): a 5xxxx host port can
    # be taken at random by an outgoing connection and block `up`.
    ports:
      - '127.0.0.1:25432:5432'
    volumes:
      # PG18's image moved the data directory: the volume must mount the parent
      # /var/lib/postgresql, not .../data, or the container crash-loops on restart.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campushomes -d campushomes_dev']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  # Local-only self-hosted Logto (identity provider), so landlord/staff/student
  # sign-in works without needing the staging tenant's credentials. NOT the
  # pattern used in staging/production (see CLAUDE.md) — this is throwaway
  # dev-only infra with its own isolated tenant and data.
  logto-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: logto_dev
      POSTGRES_DB: logto
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logto -d logto']
      interval: 2s
      timeout: 3s
      retries: 20

  logto:
    # Pinned: a floating tag silently changes auth behaviour between laptops.
    image: svhd/logto:1.43.0
    restart: unless-stopped
    # Seed on first boot (--swe = skip when the schema already exists), as in
    # Logto's own compose file; without it a fresh logto-db never starts.
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    depends_on:
      logto-db:
        condition: service_healthy
    environment:
      DB_URL: postgres://logto:logto_dev@logto-db:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    # The HTTP Email connector calls the API's /api/auth/logto/email-webhook
    # on the host (pnpm dev runs the API outside Docker).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:3002:3002'

volumes:
  postgres_data:
  redis_data:
  logto_postgres_data:

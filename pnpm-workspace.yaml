packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  # optional native accel for bullmq's msgpack — pure-JS fallback is fine
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true

overrides:
  esbuild@0.18.20: 0.25.0
  image-size@1.2.1: 2.0.3
  uuid@8.3.2: 11.1.1
  proxy-addr@<2.0.8: 2.0.8
  source-map-js@<1.2.2: 1.2.2

catalog:
  zod: ^4.1.12
  typescript: ^5.9.3

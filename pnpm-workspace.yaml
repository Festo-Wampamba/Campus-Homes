packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  # optional native accel for bullmq's msgpack — pure-JS fallback is fine
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true

overrides:
  esbuild@0.18.20: 0.25.0
  image-size@1.2.1: 2.0.3
  uuid@8.3.2: 11.1.1
  proxy-addr@<2.0.8: 2.0.8
  source-map-js@<1.2.2: 1.2.2
  body-parser@<2.4.0: 2.4.0
  multer@<2.5.0: 2.5.0

# Allowed 2026-11-18 (Festo): picomatch ReDoS (GHSA-fc5q-39xc-vjpf) has no
# patched release yet (fix is 4.0.8, unpublished). Reached only via
# next-intl > @parcel/watcher at build time, not on any request path.
# Remove this and add `picomatch@>=4.0.0 <4.0.8: 4.0.8` to overrides once 4.0.8 ships.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

catalog:
  zod: ^4.6.6
  typescript: ^5.9.3

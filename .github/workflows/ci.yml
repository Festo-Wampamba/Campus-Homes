name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy-production (below) be triggered by hand from the Actions tab.
  # Production deploys stay a deliberate action, not an on-push one — this
  # only replaces manually clicking through the Dokploy UI with a gated,
  # health-checked run of the same steps deploy-staging already automates.
  workflow_dispatch:

# Repo had zero CI before this — Dokploy's GitHub App was the only build
# trigger, and pre-merge discipline was the only quality gate (see the
# Neon/Logto migration review, Phase 0.3). This does not touch Dokploy or
# deploy anything; it only runs lint/typecheck/test/build on every push and PR.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image the local test DB pins (apps/api/docker-compose.test.yml),
        # resolved to a digest so CI can't silently drift onto a newer PG/PostGIS
        # minor without anyone noticing.
        image: postgis/postgis@sha256:eb2e8b8afd9b0ecee83bc20fd01aca62a5071bada2c0f38763174b653f8eed42
        env:
          POSTGRES_USER: campushomes
          POSTGRES_PASSWORD: campushomes_test
          POSTGRES_DB: campushomes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushomes -d campushomes_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://campushomes:campushomes_test@localhost:5432/campushomes_test
      # Every DB-backed spec connects via TEST_DATABASE_URL, not DATABASE_URL,
      # and falls back to the local docker-compose port 54329 — which does not
      # exist on a runner. Without this the whole suite fails at pool.connect().
      TEST_DATABASE_URL: postgresql://campushomes:campushomes_test@localhost:5432/campushomes_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nest/Next both consume packages/shared from dist/, not src/, at
      # typecheck/build/runtime — must build it first (same order as both
      # Dockerfiles).
      - run: pnpm --filter @campushomes/shared build

      - run: pnpm typecheck

      - run: pnpm lint

      # db:migrate shells out via `node --env-file=.env`, so it needs the
      # file to exist even though DATABASE_URL is already in the job env.
      - run: echo "DATABASE_URL=$DATABASE_URL" > apps/api/.env
      - run: pnpm --filter @campushomes/api db:migrate

      - run: pnpm test

      - run: pnpm --filter @campushomes/api build
      - run: pnpm --filter @campushomes/web build

      - name: Validate API container builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Validate web container builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

  # Staging deploys itself once CI is green; production stays a deliberate
  # manual action. Dokploy's own auto-deploy must be turned OFF for
  # campushomes-api-staging, or its ungated trigger races this one on every
  # push — adding that gate is the whole point of this job.
  #
  # Deploys via Dokploy's REST API, not its deploy webhook. The webhook is
  # built to receive a git provider's push event: it demands provider headers
  # (x-github-event et al), branch-matches the payload, and — decisively —
  # rejects every call with HTTP 400 while auto-deploy is disabled:
  #   if (!application?.autoDeploy) { res.status(400)... }
  # so "webhook" and "auto-deploy off" are mutually exclusive by design.
  # The API path has no such coupling and is the documented way to deploy
  # from CI. All three values are secrets: this repository is public, and
  # the Dokploy host and application id are infrastructure detail.
  deploy-staging:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set build-arg so the image can report its own commit
        # apps/api/Dockerfile bakes GIT_COMMIT_SHA into commit_sha.txt at build
        # time. It used to be read via `git rev-parse HEAD` inside the builder
        # stage, but Dokploy fetches source through its GitHub App installation
        # (a tarball, not a real `git clone`), so `.git` never existed in that
        # build context and every build silently fell back to "unknown". Passing
        # the SHA in explicitly as a build-arg has no such dependency.
        #
        # application.saveEnvironment replaces the whole stored config in one
        # call, so the current env/createEnvFile/buildSecrets must be read back
        # and resent unchanged alongside the new buildArgs — a partial payload
        # would wipe the app's real secrets.
        env:
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_URL: ${{ secrets.DOKPLOY_API_URL }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          for name in API_KEY API_URL APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::DOKPLOY_$name is not set — add it under Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          current=$(curl --fail --silent --show-error \
            "$API_URL/api/application.one?applicationId=$APP_ID" \
            -H "x-api-key: $API_KEY")
          jq -n \
            --arg appId "$APP_ID" \
            --arg env "$(jq -r '.env // ""' <<<"$current")" \
            --argjson createEnvFile "$(jq -r '.createEnvFile // false' <<<"$current")" \
            --arg buildSecrets "$(jq -r '.buildSecrets // ""' <<<"$current")" \
            --arg sha "$GITHUB_SHA" \
            '{applicationId: $appId, env: $env, createEnvFile: $createEnvFile, buildSecrets: $buildSecrets, buildArgs: ("GIT_COMMIT_SHA=" + $sha)}' \
            > /tmp/save-env-payload.json
          curl --fail --silent --show-error \
            -X POST "$API_URL/api/application.saveEnvironment" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/save-env-payload.json

      - name: Trigger Dokploy deploy
        env:
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_URL: ${{ secrets.DOKPLOY_API_URL }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$API_URL/api/application.deploy" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"

      - name: Wait for staging to report healthy on this commit
        # Catches a deploy that leaves staging broken — the failure mode that
        # took staging down on 2026-08-29, when a Dokploy deploy overwrote the
        # live service env with stale credentials and nothing surfaced it.
        #
        # /health now carries the built image's commit SHA (apps/api/Dockerfile
        # + health.controller.ts), so this gate checks for THIS push's SHA
        # specifically — not just "something healthy", which could have been
        # the outgoing container answering before Dokploy's build finished.
        run: |
          sleep 120
          for attempt in $(seq 1 30); do
            body=$(curl -s -m 10 https://api-staging.campushomes.co.ug/api/v1/health || true)
            echo "attempt $attempt: ${body:-no response}"
            case "$body" in
              *'"status":"ok"'*"\"commit\":\"${GITHUB_SHA}\""*) echo "staging healthy on ${GITHUB_SHA}"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::staging did not report healthy on ${GITHUB_SHA} within 7 minutes of the deploy"
          exit 1

  # Manual-only (see workflow_dispatch above) — production has stayed a
  # deliberate action since the 3-hour launch cutover, when every deploy was
  # clicked through the Dokploy UI by hand with no health-gate or commit-SHA
  # verification. Same steps as deploy-staging, same Dokploy instance
  # (DOKPLOY_API_KEY/API_URL are instance-level, not per-app — only the
  # app id and target host differ), pointed at campushomes-api instead of
  # campushomes-api-staging.
  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set build-arg so the image can report its own commit
        env:
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_URL: ${{ secrets.DOKPLOY_API_URL }}
          APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
        run: |
          for name in API_KEY API_URL APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::DOKPLOY_$name is not set — add it under Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          current=$(curl --fail --silent --show-error \
            "$API_URL/api/application.one?applicationId=$APP_ID" \
            -H "x-api-key: $API_KEY")
          jq -n \
            --arg appId "$APP_ID" \
            --arg env "$(jq -r '.env // ""' <<<"$current")" \
            --argjson createEnvFile "$(jq -r '.createEnvFile // false' <<<"$current")" \
            --arg buildSecrets "$(jq -r '.buildSecrets // ""' <<<"$current")" \
            --arg sha "$GITHUB_SHA" \
            '{applicationId: $appId, env: $env, createEnvFile: $createEnvFile, buildSecrets: $buildSecrets, buildArgs: ("GIT_COMMIT_SHA=" + $sha)}' \
            > /tmp/save-env-payload.json
          curl --fail --silent --show-error \
            -X POST "$API_URL/api/application.saveEnvironment" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/save-env-payload.json

      - name: Trigger Dokploy deploy
        env:
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_URL: ${{ secrets.DOKPLOY_API_URL }}
          APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$API_URL/api/application.deploy" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"

      - name: Wait for production to report healthy on this commit
        run: |
          sleep 120
          for attempt in $(seq 1 30); do
            body=$(curl -s -m 10 https://api.campushomes.co.ug/api/v1/health || true)
            echo "attempt $attempt: ${body:-no response}"
            case "$body" in
              *'"status":"ok"'*"\"commit\":\"${GITHUB_SHA}\""*) echo "production healthy on ${GITHUB_SHA}"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::production did not report healthy on ${GITHUB_SHA} within 7 minutes of the deploy"
          exit 1

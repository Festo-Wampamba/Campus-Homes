name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repo had zero CI before this — Dokploy's GitHub App was the only build
# trigger, and pre-merge discipline was the only quality gate (see the
# Neon/Logto migration review, Phase 0.3). This does not touch Dokploy or
# deploy anything; it only runs lint/typecheck/test/build on every push and PR.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image the local test DB pins (apps/api/docker-compose.test.yml),
        # resolved to a digest so CI can't silently drift onto a newer PG/PostGIS
        # minor without anyone noticing.
        image: postgis/postgis@sha256:eb2e8b8afd9b0ecee83bc20fd01aca62a5071bada2c0f38763174b653f8eed42
        env:
          POSTGRES_USER: campushomes
          POSTGRES_PASSWORD: campushomes_test
          POSTGRES_DB: campushomes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushomes -d campushomes_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://campushomes:campushomes_test@localhost:5432/campushomes_test
      # Every DB-backed spec connects via TEST_DATABASE_URL, not DATABASE_URL,
      # and falls back to the local docker-compose port 54329 — which does not
      # exist on a runner. Without this the whole suite fails at pool.connect().
      TEST_DATABASE_URL: postgresql://campushomes:campushomes_test@localhost:5432/campushomes_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nest/Next both consume packages/shared from dist/, not src/, at
      # typecheck/build/runtime — must build it first (same order as both
      # Dockerfiles).
      - run: pnpm --filter @campushomes/shared build

      - run: pnpm typecheck

      - run: pnpm lint

      # db:migrate shells out via `node --env-file=.env`, so it needs the
      # file to exist even though DATABASE_URL is already in the job env.
      - run: echo "DATABASE_URL=$DATABASE_URL" > apps/api/.env
      - run: pnpm --filter @campushomes/api db:migrate

      - run: pnpm test

      - run: pnpm --filter @campushomes/api build
      - run: pnpm --filter @campushomes/web build

      - name: Validate API container builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Validate web container builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

  # Staging deploys itself once CI is green; production stays a deliberate
  # manual action. Dokploy's own GitHub auto-deploy must be turned OFF for
  # campushomes-api-staging, or it and this job race each other every push —
  # and Dokploy's trigger fires regardless of whether the build is green,
  # which is the gate this job exists to add.
  deploy-staging:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        env:
          # Deployments tab -> Webhook URL. Held as a secret rather than a
          # config value: anyone holding it can deploy staging at will.
          WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_STAGING_WEBHOOK is not set — add it under Settings > Secrets > Actions"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK"

      - name: Wait for staging to report healthy
        # Catches a deploy that leaves staging broken — the failure mode that
        # took staging down on 2026-08-29, when a Dokploy deploy overwrote the
        # live service env with stale credentials and nothing surfaced it.
        #
        # Known limitation: /health carries no build identifier, so this proves
        # something healthy is serving, not that the NEW image is. The leading
        # sleep covers Dokploy's build so we are unlikely to be reading the
        # outgoing container.
        run: |
          sleep 120
          for attempt in $(seq 1 30); do
            body=$(curl -s -m 10 https://api-staging.campushomes.co.ug/api/v1/health || true)
            echo "attempt $attempt: ${body:-no response}"
            case "$body" in
              *'"status":"ok"'*) echo "staging healthy"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::staging did not report healthy within 7 minutes of the deploy"
          exit 1

# Free uptime check: GitHub emails a failed scheduled run to whoever last
# edited this schedule. Scheduled runs can start a few minutes late, so this
# catches outages (domain expiry, VPS suspension, crash loops), not blips.
# ponytail: GitHub cron; move to an uptime service if minute-level alerts matter.
name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # /health returns 503 when the database or Redis is down. Exact 200 is
      # required: curl -f lets a 3xx (bad redirect) through as success.
      - name: API health
        run: curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://api.campushomes.co.ug/api/v1/health | grep -qx 200
      # The web app's own /version JSON, not the homepage: Cloudflare can serve
      # a cached or Always Online copy of HTML while the origin is down, but
      # only the live Next server returns {"commit":...}. The run-id query
      # skips any cache. A challenge page or redirect fails the check too; if
      # Cloudflare ever challenges GitHub runners (403 while the site works),
      # add a WAF skip rule for /version.
      - name: Web app
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 "https://campushomes.co.ug/version?probe=${GITHUB_RUN_ID}" | grep -q '"commit"'
